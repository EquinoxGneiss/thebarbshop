<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Welcome Back</h2>

    <form method="POST" action="{{ url_for('main.login') }}" class="space-y-5">
      {% if error %}
        <div class="text-red-500 text-sm text-center">{{ error }}</div>
      {% endif %}
      <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
      <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Log In</button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-600">
      Don't have an account? <a href="{{ url_for('main.signup') }}" class="text-blue-500 hover:underline">Sign up</a>
    </p>
  </div>
</body>
</html>
