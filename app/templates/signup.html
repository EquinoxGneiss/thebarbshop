<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - The Barbshop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body 
  class="bg-gray-100 flex items-center justify-center min-h-screen"
  style="background-image: url('/static/uploads/background/barbershop.jpg');"
  >
  <div class="bg-transparent p-8 rounded-2xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-white">Create an Account</h2>

    <form method="POST" action="{{ url_for('main.signup') }}" class="space-y-4">
      {% if error %}
        <div class="text-red-500 text-sm text-center">{{ error }}</div>
      {% endif %}

      <input type="text" name="full_name" placeholder="Full Name" required class="w-full px-4 py-2 border rounded-lg">
      <input type="date" name="birthdate" required class="w-full px-4 py-2 border rounded-lg">
      <input type="number" name="age" placeholder="Age" required class="w-full px-4 py-2 border rounded-lg">
      <input type="text" name="address" placeholder="Address" required class="w-full px-4 py-2 border rounded-lg">
      <input type="text" name="contact" placeholder="Contact Number" required class="w-full px-4 py-2 border rounded-lg">
      <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-2 border rounded-lg">
      <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border rounded-lg">
      <input type="password" name="confirm_password" placeholder="Confirm Password" required class="w-full px-4 py-2 border rounded-lg">

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300">
        Sign Up
      </button>
    </form>

    <p class="mt-6 text-sm text-center text-white">
      Already have an account?
      <a href="{{ url_for('main.login') }}" class="text-blue-500 hover:underline">Log in</a>
    </p>
  </div>
</body>
</html>
