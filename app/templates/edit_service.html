<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">✏️ Edit Service</h2>
    <form method="POST" enctype="multipart/form-data">
      <input type="text" name="name" value="{{ service.name }}" class="w-full p-2 border rounded mb-3" required>
      <textarea name="description" class="w-full p-2 border rounded mb-3" required>{{ service.description }}</textarea>
      <input type="number" step="0.01" name="price" value="{{ service.price }}" class="w-full p-2 border rounded mb-3" required>

      <div class="mb-3">
        {% if service.image %}
          <img src="{{ url_for('static', filename='uploads/services/' + service.image) }}" class="h-24 w-24 rounded mb-2">
        {% endif %}
        <input type="file" name="image" accept="image/*">
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Changes</button>
      <a href="{{ url_for('main.admin_dashboard') }}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
    </form>
  </div>
</body>
</html>
