<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-xl bg-white p-6 rounded shadow">
      <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-2">
        <span>📝</span> Edit Product
      </h1>
  
      <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="text" name="name" value="{{ product.name }}" required class="w-full p-2 border rounded" placeholder="Product Name">
        <textarea name="description" required class="w-full p-2 border rounded">{{ product.description }}</textarea>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required class="w-full p-2 border rounded">
        <input type="number" name="stock" value="{{ product.stock }}" required class="w-full p-2 border rounded">
        <input type="file" name="image" class="w-full p-2 border rounded">
  
        {% if product.image %}
          <img src="{{ url_for('static', filename='uploads/products/' + product.image) }}" class="h-32 w-32 object-cover rounded">
        {% endif %}
  
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Update Product</button>
      </form>
  
      <a href="{{ url_for('main.admin_dashboard') }}" class="mt-4 inline-block text-blue-500 hover:underline">← Back to Dashboard</a>
    </div>
  
  </body>
  
</html>
