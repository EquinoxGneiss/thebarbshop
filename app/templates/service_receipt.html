<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Service Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 py-10 px-6 flex justify-center items-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">Service Booking Receipt</h1>

    <div class="mb-4">
      <p><strong>Client Name:</strong> {{ order.user.full_name }}</p>
      <p><strong>Service:</strong> {{ order.service }}</p>
      <p><strong>Date:</strong> {{ order.date }}</p>
      <p><strong>Time:</strong> {{ order.time }}</p>
      <p><strong>Status:</strong> 
        <span class="font-semibold {% if order.status == 'paid' %}text-green-600{% else %}text-yellow-600{% endif %}">
          {{ order.status|capitalize }}
        </span>
      </p>
      <p><strong>Order Code:</strong> {{ order.order_code }}</p>
    </div>

    <div class="flex justify-between mt-8">
      <a href="{{ url_for('main.profile') }}" class="text-blue-500 hover:underline">← Back to Profile</a>
      <button onclick="window.print()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Print Receipt
      </button>
    </div>
  </div>

</body>
</html>
